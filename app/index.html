<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot KB — WebUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Screenshot KB</span>
      <span class="brand-sub">webui</span>
      <span id="live-dot" class="live-dot" title="auto-refresh on"></span>
    </div>
    <div class="topbar-right">
      <span id="data-environment" class="data-environment">data: —</span>
      <label class="poll-toggle">
        <input type="checkbox" id="poll-enabled" checked>
        <span>auto</span>
      </label>
      <span id="last-updated" class="muted">—</span>
    </div>
  </header>

<main class="layout">
  <section id="tag-cloud-section" class="section tag-cloud-section">
    <div class="section-header">
      <h1 class="section-title">Tag cloud</h1>
      <span id="tag-cloud-meta" class="tags-meta muted"></span>
    </div>
    <div id="tag-cloud" class="tag-cloud" aria-label="Tags by occurrence"></div>
  </section>

  <section id="timeline-section" class="section">
    <div class="section-header">
      <h1 class="section-title">Search</h1>
      <div class="filters">
        <input type="text" id="filter-q" class="filter-input"
              placeholder="search caption / tag / ocr / entity">
        <select id="filter-status" class="filter-input">
          <option value="all">status: all</option>
          <option value="ok">ok</option>
          <option value="fail">fail</option>
          <option value="none">none</option>
        </select>
        <select id="filter-tag" class="filter-input">
          <option value="">tag: all</option>
        </select>
        <button id="clear-filters" class="btn muted">clear</button>
      </div>
    </div>

    <div id="timeline-status" class="timeline-status muted">loading…</div>
    <div id="timeline" class="timeline"></div>
    <div id="load-more-wrap" class="load-more-wrap">
      <button id="load-more" class="btn">load more</button>
    </div>
  </section>

  <section id="tags-section" class="section">
    <h1 class="section-title">Tags</h1>
    <div id="tags-meta" class="tags-meta muted"></div>
    <div id="top-tags" class="top-tags"></div>
    <div id="edges" class="edges"></div>
  </section>

  <section id="backlog" class="section backlog">
    <h1 class="section-title">Backlog</h1>
    <div class="backlog-summary">
      <div>
        <div id="backlog-line1" class="backlog-line primary">—</div>
        <div id="backlog-line2" class="backlog-line muted">—</div>
      </div>
      <div class="backlog-chart-wrap">
        <div class="backlog-chart-heading">
          <span>processing time</span>
          <span id="backlog-chart-meta" class="muted">last 20</span>
        </div>
        <div id="backlog-chart" class="backlog-chart" aria-label="Processing time for the last 20 processed pictures"></div>
      </div>
    </div>
  </section>
</main>

   <div id="record-panel" class="record-panel">
     <div class="record-panel-inner">
       <button id="record-close" class="btn record-close">×</button>
       <div id="record-body" class="record-body"></div>
     </div>
   </div>

    <div id="original-box" class="original-box" style="display:none">
      <img id="original-img" class="original-img" alt="full-res original">
      <div id="original-msg" class="original-msg"></div>
      <button id="original-close" class="btn original-close">×</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
