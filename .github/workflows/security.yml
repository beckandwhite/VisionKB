name: Security

# Quoted so this parses under YAML 1.1 (bare `on:` would become boolean true).
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install bandit==1.7.10
      - name: bandit
        run: bandit -r . -x ./.venv,./tests,./__pycache__ -f sarif -o bandit.sarif
      - name: upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@85c0c095cb90e3f44221efe532e63883af987457 # v3
        with:
          sarif_file: bandit.sarif

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITLEAKS_ENABLE_COMMIT_TRAVERSAL: "true"
