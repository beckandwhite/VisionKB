name: Security

# Quoted so this parses under YAML 1.1 (bare `on:` would become boolean true).
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: install
        run: pip install 'bandit[sarif]==1.7.10'
      - name: bandit
        run: bandit -r . -x ./.venv,./tests,./__pycache__ -f sarif -o bandit.sarif
      - name: upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@3306ba4df796b6b5059316f3af8bdea1e2138c9b # v3
        with:
          sarif_file: bandit.sarif

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMIT_TRAVERSAL: "true"

  # Dependency-CVE scan (issue #84): closes the #30 deferral. The runtime now
  # takes third-party deps (pillow, pillow-heif, spacy), so a vulnerable
  # declared or transitive dependency would otherwise ship undetected.
  # pip-audit resolves the pinned requirements against the PyPI advisory DB;
  # it has no severity filter, so it fails the build on ANY known vuln
  # (LOW..CRITICAL), which is a safe superset of the "fail on HIGH/CRITICAL"
  # intent. Runs on a GitHub-hosted runner per the self-hosted-runner policy
  # (SECURITY.md): no untrusted/PR code executes on the private LAN runner.
  pip-audit:
    name: pip-audit dependency-CVE scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: install pip-audit
        run: pip install 'pip-audit==2.10.1'
      - name: audit dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt
