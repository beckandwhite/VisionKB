<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot KB — WebUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Screenshot KB</span>
      <span class="brand-sub">webui</span>
      <span id="live-dot" class="live-dot" title="auto-refresh on"></span>
    </div>
    <div class="topbar-right">
      <span id="data-environment" class="data-environment">data: —</span>
      <label class="poll-toggle">
        <input type="checkbox" id="poll-enabled" checked>
        <span>auto</span>
      </label>
      <span id="last-updated" class="muted">—</span>
    </div>
  </header>

<main class="layout">
  <section id="timeline-section" class="section">
    <div class="section-header">
      <h1 class="section-title">Search</h1>
      <div class="filters">
        <input type="text" id="filter-q" class="filter-input"
            placeholder="search Work 1 answers">
        <label class="result-limit">show
          <select id="result-limit" class="filter-input" aria-label="pictures to show">
            <option value="50" selected>last 50</option>
            <option value="100">last 100</option>
            <option value="150">last 150</option>
            <option value="200">last 200</option>
          </select>
        </label>
        <button id="clear-filters" class="btn muted">clear</button>
      </div>
    </div>

    <div class="mtime-filter" aria-label="Modification time filter">
      <div class="mtime-filter-head">
        <span class="filter-label">modified</span>
        <span id="mtime-range-label" class="muted">loading…</span>
      </div>
      <div class="mtime-track-wrap">
        <div id="mtime-heatmap" class="mtime-heatmap" aria-hidden="true"></div>
        <div class="mtime-track"></div>
        <input id="mtime-from" class="mtime-slider" type="range"
               min="0" max="1" value="0" aria-label="earliest modification time">
        <input id="mtime-to" class="mtime-slider" type="range"
               min="0" max="1" value="1" aria-label="latest modification time">
      </div>
      <div class="mtime-endpoints">
        <span id="mtime-from-label" class="muted">—</span>
        <span id="mtime-to-label" class="muted">—</span>
      </div>
    </div>

    <div id="timeline-status" class="timeline-status muted">loading…</div>
    <div id="timeline" class="timeline"></div>
    <div id="load-more-wrap" class="load-more-wrap">
      <button id="load-more" class="btn">load more</button>
    </div>
  </section>

  <section id="worker1-backlog" class="section backlog">
    <h1 class="section-title">Worker1 - Backlog</h1>
    <div class="backlog-summary">
      <div>
        <div id="worker1-backlog-line1" class="backlog-line primary">—</div>
        <div id="worker1-backlog-line2" class="backlog-line muted">—</div>
      </div>
      <div class="backlog-chart-wrap">
        <div class="backlog-chart-heading">
          <span>processing time</span>
          <span id="worker1-backlog-chart-meta" class="muted">last 20</span>
        </div>
        <div class="backlog-chart-area">
          <div id="worker1-backlog-chart-axis" class="backlog-chart-axis" aria-hidden="true"></div>
          <div id="worker1-backlog-chart" class="backlog-chart" aria-label="Worker1 processing time for the last 20 processed pictures"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="worker4-backlog" class="section backlog">
    <h1 class="section-title">Worker4 backlog</h1>
    <div class="backlog-summary">
      <div>
        <div id="worker4-backlog-line1" class="backlog-line primary">—</div>
        <div id="worker4-backlog-line2" class="backlog-line muted">—</div>
      </div>
      <div class="backlog-chart-wrap">
        <div class="backlog-chart-heading">
          <span>processing time</span>
          <span id="worker4-backlog-chart-meta" class="muted">last 20</span>
        </div>
        <div class="backlog-chart-area">
          <div id="worker4-backlog-chart-axis" class="backlog-chart-axis" aria-hidden="true"></div>
          <div id="worker4-backlog-chart" class="backlog-chart" aria-label="Worker4 processing time for the last 20 processed pictures"></div>
        </div>
      </div>
    </div>
  </section>
</main>

   <div id="record-panel" class="record-panel">
     <div class="record-panel-inner">
       <button id="record-close" class="btn record-close">×</button>
       <div id="record-body" class="record-body"></div>
     </div>
   </div>

    <div id="original-box" class="original-box" style="display:none">
      <img id="original-img" class="original-img" alt="full-res original">
      <div id="original-msg" class="original-msg"></div>
      <button id="original-close" class="btn original-close">×</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
